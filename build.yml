name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          unzip FFInjector.zip -d build_project
          GRADLEW_DIR=$(find build_project -name "gradlew" -type f | head -n 1 | xargs dirname)
          echo "PROJECT_DIR=$GRADLEW_DIR" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Build Release APK
        run: ./gradlew assembleRelease
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FFInjector-release
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          retention-days: 7
